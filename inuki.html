function spr(sp,X,Y,f,col,sc=1){for(let i=0;i<sp.length;i++)for(let j=0;j<sp[i].length;j++){const ch=sp[i][j];if(ch=='.')continue;

// ---------- pixel helpers ----------
const BY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function hex(h){h=h.slice(1);if(h.length==3)h=[...h].map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function ditherGrad(g,cols,y0,y1,w){const P=cols.map(hex),n=P.length-1;for(let y=y0;y<y1;y++){const t=(y-y0)/(y1-y0)*n;for(let X=0;X<w;X++){let i=Math.floor(t),f=t-i;if(f*16>BY[(y%4)*4+X%4])i++;i=Math.min(n,i);const p=P[i];g.fillStyle=`rgb(${p})`;g.fillRect(X,y,1,1)}}}
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function layer(w){const cv=document.createElement('canvas');cv.width=w;cv.height=H;return cv}
function ridge(g,R,w,base,amp,col,step=1){g.fillStyle=col;let h=0,v=0;for(let X=0;X<w;X++){v+=(R()-.5)*step;v*=.97;h=base-amp*(.5+.5*Math.sin(X/w*Math.PI*2*3+1))+v*6;
 const hh=h+Math.sin(X*.7)*.6;g.fillRect(X,Math.round(hh),1,H)}}
function pine(g,X,Y,sz,col,rim,R){g.fillStyle=col;g.fillRect(X,Y-sz*3,Math.max(1,sz/3|0),sz*3);for(let i=0;i<4;i++){const ww=sz*(3-i*.5)*(.8+R()*.4),yy=Y-sz*3-i*sz*.9,ox=(R()-.5)*sz;
 g.fillStyle=col;g.fillRect(Math.round(X+ox-ww/2),Math.round(yy-sz*.5),Math.round(ww),Math.ceil(sz*.7));if(rim){g.fillStyle=rim;for(let p=0;p<ww;p+=2+R()*4|0)if(R()<.5)g.fillRect(Math.round(X+ox-ww/2+p),Math.round(yy-sz*.5),R()<.5?2:1,1)}}}
function torii(g,X,Y,s,col,rim){g.fillStyle=col;g.fillRect(X-s*4,Y-s*9,s*8,s);g.fillRect(X-s*4-1,Y-s*9-1,2,1);g.fillRect(X+s*4-1,Y-s*9-1,2,1);g.fillRect(X-s*3.5,Y-s*7.5,s*7,s*.6);
 g.fillRect(X-s*3,Y-s*9,s*.8,s*9);g.fillRect(X+s*2.2,Y-s*9,s*.8,s*9);if(rim){g.fillStyle=rim;g.fillRect(X-s*4,Y-s*9-1,s*3,1);g.fillRect(X+s,Y-s*9-1,s*2.5,1);g.fillRect(X-s*2,Y-s*7.5-1,s*2,1)}}
function pagoda(g,X,Y,w,fl,col,win,R){for(let f=0;f<fl;f++){const yy=Y-f*12,ww=w-f*6;g.fillStyle=col;g.fillRect(X-ww/2,yy-10,ww,10);g.fillRect(X-ww/2-5,yy-12,ww+10,3);g.fillRect(X-ww/2-7,yy-13,3,2);g.fillRect(X+ww/2+4,yy-13,3,2);
 g.fillStyle=win;for(let p=-ww/2+3;p<ww/2-3;p+=5)if(R()<.6)g.fillRect(Math.round(X+p),yy-7,2,3)}g.fillStyle=col;g.fillRect(X-1,Y-fl*12-6,2,6)}
function deadTree(g,X,Y,col,R){g.fillStyle=col;g.fillRect(X,Y-40,4,40);let bx=X+2,by=Y-40;for(let i=0;i<12;i++){const dx=(R()-.5)*30,dy=-R()*14;for(let t=0;t<1;t+=.08)g.fillRect(Math.round(bx+dx*t),Math.round(by+dy*t),2,1);
 g.fillRect(Math.round(bx+dx-3),Math.round(by+dy-2),6+R()*6|0,2);if(R()<.5){bx+=dx*.5;by+=dy*.5}}}

const LV=[
 {n:'I. Moonlit Torii',col:{s:'#0b0914',r:'#ff9ac1',e:'#ff9ac1'},en:{s:'#120e1e',r:'#ff9ac1',e:'#ff4d8d'},ground:'#0b0914',kills:12,arch:0,
  sky:g=>{ditherGrad(g,['#1c1a33','#252342','#2e2850','#3d2c5c','#4a2f63'],0,H,W);const R=rnd(3);g.fillStyle='#cfc8ff';for(let i=0;i<30;i++)g.fillRect(R()*W|0,R()*70|0,1,1);
   g.fillStyle='#17152a';for(const[cx,cy,w]of[[50,25,50],[190,50,40]])for(let i=0;i<5;i++)g.fillRect(cx-w/2+i*4,cy+i%2*2,w-i*6,3)},
  far:(g,w)=>{ridge(g,rnd(5),w,100,18,'#3a2a5a',.5)},
  mid:(g,w)=>{const R=rnd(9);ridge(g,R,w,112,8,'#241a3a',.4);for(let X=60;X<w;X+=170+R()*80)torii(g,X|0,GY+2,4,'#07060c','#ff9ac1')},
  near:(g,w)=>{const R=rnd(11);for(let X=20;X<w;X+=90+R()*90)pine(g,X|0,GY+4,6+R()*4|0,'#050409','#ff9ac1',R)}},
 {n:'II. Lantern Village',col:{s:'#0d0a14',r:'#ff8a8a',e:'#ffd0a0'},en:{s:'#140e1c',r:'#ff8a8a',e:'#ff5050'},ground:'#120c1a',kills:16,arch:.25,water:'#2a1d3d',
  sky:g=>{ditherGrad(g,['#2a1d45','#3e2758','#6a3a6e','#a35a7e','#c8788a','#7a4a78'],0,96,W);ditherGrad(g,['#3a2850','#2a1d3d'],96,H,W);
   const cx=70,cy=48,r=22;for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++){const d=xx*xx+yy*yy;if(d<r*r){g.fillStyle=(Math.sin(xx*.5)*Math.cos(yy*.6)>.4)?'#e09aa0':'#f2b8b0';g.fillRect(cx+xx,cy+yy,1,1)}}
   g.fillStyle='#5a3466';for(let i=0;i<9;i++){const yy=20+i*8;g.fillRect((i*47)%W,yy,60+i*7%40,1)}},
  far:(g,w)=>{ridge(g,rnd(15),w,92,14,'#5a3e74',.6)},
  mid:(g,w)=>{const R=rnd(17);ridge(g,R,w,100,5,'#3a2852',.4);for(let X=40;X<w;X+=120+R()*90)pagoda(g,X|0,GY-4,26+R()*14|0,2+(R()*2|0),'#140e1e','#ff6a5a',R)},
  near:(g,w)=>{const R=rnd(19);for(let X=80;X<w;X+=200+R()*100)deadTree(g,X|0,GY+2,'#08060d',R);g.fillStyle='#08060d';for(let X=0;X<w;X+=14)g.fillRect(X,GY-6,2,8)}},
 {n:'III. Misty Cliffs',col:{s:'#1b1c1b',r:'#ffffff',e:'#ffffff'},en:{s:'#2a2b2a',r:'#eeeeea',e:'#c33'},ground:'#3a3b38',kills:20,arch:.4,fog:1,
  sky:g=>{ditherGrad(g,['#cfcfca','#dcdcd7','#e9e9e4','#efefea'],0,H,W);g.fillStyle='#f6f6e8';g.beginPath();g.arc(48,32,9,0,7);g.fill()},
  far:(g,w)=>{const R=rnd(23);g.fillStyle='#c2c3bf';for(let X=0;X<w;X+=18+R()*26){const hh=30+R()*45,ww=10+R()*16;g.fillRect(X|0,(98-hh)|0,ww|0,H);g.fillRect((X+2)|0,(94-hh)|0,(ww-5)|0,4)}},
  mid:(g,w)=>{const R=rnd(29);g.fillStyle='#9a9c97';for(let X=0;X<w;X+=30+R()*40){const hh=12+R()*30;for(let i=0;i<hh;i+=3)g.fillRect((X-i*.2)|0,(GY-hh+i)|0,(16+i*.6)|0,3)}g.fillStyle='#8a8c87';ridge(g,R,w,GY+2,4,'#8a8c87',.3)},
  near:(g,w)=>{const R=rnd(31);for(let X=60;X<w;X+=160+R()*100){pine(g,X|0,GY+4,5+R()*3|0,'#2c2e2b','#5a5c58',R)}g.fillStyle='#2c2e2b';for(let X=0;X<w;X+=24+R()*30){g.fillRect(X|0,GY-3,8+R()*8|0,5)}}},
 {n:'IV. The Burning Camp',col:{s:'#070c0f',r:'#9ff6ff',e:'#9ff6ff'},en:{s:'#0b1418',r:'#ff9a40',e:'#ff4020'},ground:'#060b0e',kills:8,arch:.4,boss:1,rain:1,
  sky:g=>{ditherGrad(g,['#0a141a','#0f1e26','#15303a','#1a3a44','#14262e'],0,H,W);for(let r=16;r>0;r-=2){g.fillStyle=`rgba(160,240,255,${.05+.0})`;g.beginPath();g.arc(200,26,r+10,0,7);g.fill()}
   g.fillStyle='#e8ffff';g.beginPath();g.arc(200,26,9,0,7);g.fill();g.fillStyle='#16282f';for(let i=0;i<8;i++)g.fillRect((i*61)%W,10+i*7,40,3)},
  far:(g,w)=>{const R=rnd(37);g.fillStyle='#0e1d23';for(let X=0;X<w;X+=3)g.fillRect(X,(70+Math.sin(X*.05)*6+R()*6)|0,3,H)},
  mid:(g,w)=>{const R=rnd(41);g.fillStyle='#0a161b';for(let X=0;X<w;X+=2)g.fillRect(X,(88+Math.sin(X*.03)*3)|0,2,H);
   for(let X=30;X<w;X+=110+R()*60){g.fillStyle='#d8c8a0';g.fillRect(X|0,GY-26,30,14);g.fillStyle='#0a161b';g.fillRect((X+11)|0,GY-23,7,7);g.fillStyle='#d8c8a0';g.fillRect((X+13)|0,GY-21,3,3);
    for(let b=0;b<3;b++){g.fillStyle='#0a161b';g.fillRect((X+b*14)|0,GY-44,1,32);g.fillStyle='#c9bfa0';g.fillRect((X+b*14+1)|0,GY-44,4,12)}
    for(let f=0;f<3;f++){const fx=X+R()*40|0;g.fillStyle='#ff6a10';g.fillRect(fx,GY-8,4,6);g.fillStyle='#ffcc40';g.fillRect(fx+1,GY-6,2,4)}}},
  near:(g,w)=>{const R=rnd(43);for(let X=40;X<w;X+=180+R()*80)deadTree(g,X|0,GY+2,'#030608',R);g.fillStyle='#030608';for(let X=0;X<w;X+=30+R()*30)g.fillRect(X|0,GY-4,10+R()*10|0,6)}}];
const LW=512;
for(const L of LV){L.cs=layer(W);L.sky(L.cs.getContext('2d'));for(const n of['far','mid','near']){L[n+'C']=layer(LW);L[n](L[n+'C'].getContext('2d'),LW)}
 L.gC=layer(LW);const g=L.gC.getContext('2d'),R=rnd(7);g.fillStyle=L.ground;g.fillRect(0,GY,LW,H-GY);g.fillStyle=L.col.r;g.globalAlpha=.5;for(let X=0;X<LW;X+=3+R()*6|0)g.fillRect(X,GY,1,R()<.3?2:1);g.globalAlpha=1;
 if(L.water){g.fillStyle=L.water;g.fillRect(0,GY+14,LW,H);g.fillStyle='#c8788a';for(let i=0;i<40;i++)g.fillRect(R()*LW|0,GY+16+R()*24|0,4+R()*12|0,1)}}
// ---------- game ----------
let st='title',lv=0,P,en,ar,fx,cam=0,kills,combo,ct,kami=0,shake=0,slow=0,msg,mt,boss,score=0,best=0,T=0;try{best=+localStorage.ib||0}catch(e){}
function load(i){lv=i;P={x:20,y:GY,vx:0,vy:0,f:0,hp:5,inv:0,dash:0,dcd:0,an:0,slash:0};en=[];ar=[];fx=[];cam=0;kills=0;combo=0;ct=0;slow=0;boss=null;msg=LV[i].n;mt=140;
 if(LV[i].boss)boss={x:220,y:GY,hp:30,mhp:30,t:0,f:1,hit:0}}
function tap(){if(st!='play'){score=0;kami=0;load(0);st='play'}}
function spawn(){const L=LV[lv];en.push({x:cam+(Math.random()<.7?W+10:-14),y:GY,a:Math.random()<L.arch,t:Math.random()*60,an:0})}
function part(X,Y,col,n,sp=2){for(let i=0;i<n;i++)fx.push({x:X,y:Y,vx:(Math.random()-.5)*sp*2,vy:-Math.random()*sp*1.5,l:20+Math.random()*25,c:col})}
function kill(e){const L=LV[lv];part(e.x+6,e.y-7,L.en.s,10);part(e.x+6,e.y-7,L.col.r,8,3);part(e.x+6,e.y-7,'#a01030',6);kills++;combo++;ct=90;score+=10*combo;kami=Math.min(100,kami+8);shake=4;slow=4;
 fx.push({cut:1,x:e.x,y:e.y,l:24,f:P.x>e.x});fx.push({x:e.x,y:e.y-22,t:'+'+10*combo,l:40,vy:-.4,vx:0})}
function hurt(){if(P.inv>0||P.dash>0)return;P.hp--;P.inv=60;shake=8;combo=0;part(P.x+6,P.y-7,'#fff',8);if(P.hp<=0){st='over';save()}}
function save(){if(score>best){best=score;try{localStorage.ib=best}catch(e){}}}
function step(){const L=LV[lv];T++;if(mt>0)mt--;
 if(P.dash>0){P.dash--;P.vx=P.f?-6:6;fx.push({x:P.x,y:P.y,l:10,ghost:1,f:P.f})}else{P.vx=(k.R?1.6:0)-(k.L?1.6:0);if(k.R)P.f=0;if(k.L)P.f=1}
 if(k.J&&P.y>=GY){P.vy=-4.2;k.J=0}
 if(k.A&&P.dcd<=0){P.dash=10;P.dcd=22;k.A=0;P.slash=12}
 if(k.S&&kami>=100){kami=0;k.S=0;shake=14;slow=30;fx.push({flash:1,l:24});for(const e of en)kill(e);en=[];ar=[];if(boss){boss.hp-=8;boss.hit=10}}
 P.dcd--;P.inv--;if(P.slash>0)P.slash--;P.vy+=.25;P.x+=P.vx;P.y=Math.min(GY,P.y+P.vy);if(P.y>=GY)P.vy=0;P.x=Math.max(cam,P.x);if(P.vx)P.an+=.2;
 if(P.x-100>cam)cam=P.x-100;if(ct>0)ct--;else combo=0;
 if(!boss&&kills+en.length<L.kills&&en.length<4+lv&&Math.random()<.025+lv*.01)spawn();if(boss&&en.length<2&&Math.random()<.01)spawn();
 for(let i=en.length-1;i>=0;i--){const e=en[i];e.t++;const d=P.x-e.x;
  if(e.a){if(Math.abs(d)>60)e.x+=Math.sign(d)*.5;if(e.t%110==0)ar.push({x:e.x+6,y:e.y-8,vx:Math.sign(d)*2.2})}else{e.x+=Math.sign(d)*(.6+lv*.15);e.an+=.15}
  if(Math.abs(d)<10&&Math.abs(P.y-e.y)<13){if(P.dash>0||P.slash>0){kill(e);en.splice(i,1);continue}else hurt()}}
 for(let i=ar.length-1;i>=0;i--){const a=ar[i];a.x+=a.vx;if(P.slash>0&&Math.abs(a.x-P.x-6)<13&&Math.abs(a.y-P.y+7)<10){part(a.x,a.y,L.col.r,5);ar.splice(i,1);score+=5;continue}
  if(Math.abs(a.x-P.x-6)<5&&Math.abs(a.y-P.y+7)<7){hurt();ar.splice(i,1);continue}if(Math.abs(a.x-P.x)>300)ar.splice(i,1)}
 if(boss){const b=boss;b.t++;if(b.hit>0)b.hit--;const d=P.x-b.x-8;b.f=d<0;b.x=Math.max(cam+20,Math.min(cam+W-40,b.x));
  const ph=b.t%200;if(ph<120)b.x+=Math.sign(d)*.5;else if(ph>=140&&ph<170)b.x+=Math.sign(d)*3.2;
  if(b.t%150==0)for(let j=-1;j<=1;j++)ar.push({x:b.x+12,y:b.y-16+j*6,vx:Math.sign(d)*2,fire:1});
  if(Math.abs(d)<16&&Math.abs(P.y-b.y)<24){if(P.dash>0&&b.hit<=0){b.hp-=2;b.hit=15;shake=6;slow=6;part(b.x+12,b.y-15,'#9ff6ff',12);part(b.x+12,b.y-15,'#a01030',8);score+=25;kami=Math.min(100,kami+6)}else if(P.dash<=0)hurt()}
  if(b.hp<=0){part(b.x+12,b.y-15,'#9ff6ff',60,4);part(b.x+12,b.y-15,'#000',40,4);boss=null;kills=99;shake=20;slow=40;score+=500}}
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.l--;if(f.vx!=null){f.x+=f.vx;f.y+=f.vy;if(!f.t)f.vy+=.15}if(f.l<=0)fx.splice(i,1)}
 if(kills>=L.kills&&!boss&&!en.length){if(lv==3){st='win';save()}else{P.hp=Math.min(5,P.hp+1);load(lv+1)}}}
function para(cv,p){const o=Math.round(((cam*p)%LW+LW)%LW);x.drawImage(cv,-o,0);x.drawImage(cv,LW-o,0)}
function txt(t,X,Y,col,sz=1,al='center'){x.font=(8*sz)+'px monospace';x.textAlign=al;x.fillStyle='#000';x.fillText(t,X+1,Y+1);x.fillStyle=col;x.fillText(t,X,Y)}
function render(){const L=LV[lv],now=Date.now();x.drawImage(L.cs,0,0);
 const sx=shake?(Math.random()-.5)*shake|0:0,sy=shake?(Math.random()-.5)*shake|0:0;x.save();x.translate(sx,sy);
 para(L.farC,.15);if(L.fog){x.fillStyle='#e6e6e166';x.fillRect(0,0,W,H)}para(L.midC,.4);if(L.fog){x.fillStyle='#dcdcd744';x.fillRect(0,60,W,H)}
 para(L.gC,1);
 if(st=='title'){spr(HERO[0],122,GY-14,0,L.col);x.strokeStyle=L.col.r;x.beginPath();x.moveTo(132,GY-6);x.lineTo(142,GY-1);x.stroke();para(L.nearC,1.3);x.restore();
  x.fillStyle='#0006';x.fillRect(0,18,W,40);txt('INUKI',W/2,40,L.col.r,2);txt('the tale of a ninja',W/2,52,'#ddd');txt('tap to begin',W/2,124,(now/400|0)%2?'#fff':L.col.r);return}
